syntax = "proto3";

package proto;

option go_package = "BlockchainIndexingService/proto;proto";

service TransactionService {
  rpc GetTransaction (GetTransactionRequest) returns (GetTransactionResponse);
  rpc BroadcastTransaction (BroadcastTransactionRequest) returns (BroadcastTransactionResponse);
  rpc DecodeTransaction (DecodeTransactionRequest) returns (DecodeTransactionResponse);
}

message TransactionResponseDto {
  string tx_id = 1;
  int64 amount_sats = 2;
  int64 confirmations = 3;
  string block_hash = 4;
  int64 block_time = 5;
  string hex = 6;
}

message DecodedTransactionResponseDto {
  string tx_id = 1;
  uint32 version = 2;
  uint32 lock_time = 3;
  uint32 size = 4;
  uint32 vsize = 5;
  uint32 weight = 6;
}

message GetTransactionRequest {
  string tx_id = 1;
}

message GetTransactionResponse {
  TransactionResponseDto transaction = 1;
}

message BroadcastTransactionRequest {
  string hex_tx = 1;
}

message BroadcastTransactionResponse {
  string tx_id = 1;
}

message DecodeTransactionRequest {
  string hex_tx = 1;
}

message DecodeTransactionResponse {
  DecodedTransactionResponseDto transaction = 1;
}